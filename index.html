<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rose Petal Countdown to 2027</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c1218;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #e8eef2;
    }
    .scene { text-align: center; }
    h1 {
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 1.3rem;
      color: #f3d7dc;
      margin-bottom: 6px;
    }
    .subtitle { opacity: 0.7; font-size: 0.92rem; margin-bottom: 12px; }
    #rose-photo {
      width: min(420px, 92vw);
      height: auto;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }
    .info { margin-top: 12px; color: #ffb3c1; }
    .countdown {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.25);
    }
    .countdown span { color: #ff8fa3; }
    .message { margin-top: 10px; opacity: 0.8; font-size: 0.95rem; }
    .zero-state { display: none; }
    .zero-state h2 { color: #ffd6e0; font-weight: 300; }
  </style>
</head>
<body>
  <div class="scene">
    <h1>Petal by Petal</h1>
    <p class="subtitle">A rose loses one petal every day until January 1, 2027</p>
    <img id="rose-photo" src="rose.jpg" alt="rose under glass">
    <div class="info" id="petals-info">Petals remaining: —</div>
    <div class="countdown" id="countdown">Calculating...</div>
    <p class="message" id="message">Each midnight a petal falls inside the glass.</p>
    <div class="zero-state" id="zero-state">
      <h2>Happy 2027</h2>
      <p>The last petal has fallen.</p>
    </div>
  </div>
  <script>
    const TARGET = new Date("2027-01-01T00:00:00");
    function update() {
      const diff = TARGET - new Date();
      const petalsInfo = document.getElementById("petals-info");
      const countdownEl = document.getElementById("countdown");
      const messageEl = document.getElementById("message");
      const zeroState = document.getElementById("zero-state");
      if (diff <= 0) {
        petalsInfo.style.display = "none";
        countdownEl.style.display = "none";
        messageEl.style.display = "none";
        zeroState.style.display = "block";
        return;
      }
      const daysLeft = Math.ceil(diff / 86400000);
      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      petalsInfo.textContent = "Petals remaining: " + daysLeft;
      countdownEl.innerHTML =
        "<span>" + days + "</span>d " +
        "<span>" + String(hours).padStart(2, "0") + "</span>:" +
        "<span>" + String(mins).padStart(2, "0") + "</span>:" +
        "<span>" + String(secs).padStart(2, "0") + "</span>";
    }
    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
